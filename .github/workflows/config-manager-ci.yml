name: Config Manager CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/research-config-manager/**'
      - '.github/workflows/config-manager-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/research-config-manager/**'
      - '.github/workflows/config-manager-ci.yml'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './apps/research-config-manager/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/research-config-manager
        run: npm ci

      - name: Type check Node
        working-directory: ./apps/research-config-manager
        run: npm run typecheck:node

      - name: Type check Web
        working-directory: ./apps/research-config-manager
        run: npm run typecheck:web

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './apps/research-config-manager/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/research-config-manager
        run: npm ci

      - name: Run tests
        working-directory: ./apps/research-config-manager
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './apps/research-config-manager/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/research-config-manager
        run: npm ci

      - name: Build application
        working-directory: ./apps/research-config-manager
        run: npm run build
