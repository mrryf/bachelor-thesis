name: Config Manager CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/research-config-manager/**'
      - '.github/workflows/config-manager-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/research-config-manager/**'
      - '.github/workflows/config-manager-ci.yml'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './apps/research-config-manager/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/research-config-manager
        run: npm ci

      - name: Type check Node
        working-directory: ./apps/research-config-manager
        run: npm run typecheck:node

      - name: Type check Web
        working-directory: ./apps/research-config-manager
        run: npm run typecheck:web

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './apps/research-config-manager/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/research-config-manager
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./apps/research-config-manager
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./apps/research-config-manager/coverage/coverage-final.json
          flags: electron-config-manager
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './apps/research-config-manager/package-lock.json'

      - name: Install dependencies
        working-directory: ./apps/research-config-manager
        run: npm ci

      - name: Build application
        working-directory: ./apps/research-config-manager
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-ubuntu
          path: ./apps/research-config-manager/out
          retention-days: 7
