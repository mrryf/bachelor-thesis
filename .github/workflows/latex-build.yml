name: Build LaTeX Document

on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/latex-build.yml"
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
    paths:
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/latex-build.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  build_thesis:
    needs: [test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Sync Zotero References
        if: github.event_name != 'pull_request'
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        run: python scripts/sync_zotero.py

      - name: Generate Survey Item Tables
        run: python scripts/generate_item_tables.py

      - name: Sanitize Bibliography
        run: python scripts/sanitize_bib.py

      - name: Build Thesis (Docker)
        env:
          # Pinned by digest for reproducibility (2026-03-21, TeX Live 2025)
          # To update: run with :latest, get digest from logs, replace below
          TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-full@sha256:9aa57c8ddef934cb1f25837539c654980680ea4d42554a05ca7a672845ebfe6a
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SKIP_GEN_TABLES=true \
            -e SKIP_SANITIZE=true \
            $TEXLIVE_IMAGE \
            bash -c "./scripts/build.sh --thesis"
          sudo chown -R $USER:$USER content/thesis

      - name: Verify PDF exists
        run: test -f content/thesis/main.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: content/thesis/main.pdf

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: content/thesis/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
