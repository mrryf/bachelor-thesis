# Netlify configuration for SvelteKit webapp deployment

[build]
  # Base directory where the webapp lives
  base = "webapp/"

  # Build command
  command = "npm run build"

  # Publish directory (relative to base)
  publish = "build/"

# No redirects needed - SvelteKit static adapter generates proper HTML files for each route

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Prevent search engine indexing (applies to ALL deploys including production)
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, immutable, max-age=31536000"

# Environment configuration
[build.environment]
  NODE_VERSION = "20"
